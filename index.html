<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Andhuu's Heart ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #ffb6d5, #d8b4fe, #ffc6d9);
    color: #4b2142;
    overflow: hidden;
}

.heart {
    position: fixed;
    bottom: -40px;
    font-size: 25px;
    animation: float 8s linear infinite;
    opacity: 0.7;
    z-index: 0;
}

.heart:nth-child(1) {
    left: 10%;
    animation-delay: 0s;
}

.heart:nth-child(2) {
    left: 30%;
    animation-delay: 2s;
}

.heart:nth-child(3) {
    left: 50%;
    animation-delay: 4s;
}

.heart:nth-child(4) {
    left: 70%;
    animation-delay: 1s;
}

.heart:nth-child(5) {
    left: 90%;
    animation-delay: 3s;
}

@keyframes float {

    0% {
        transform: translateY(0);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh);
        opacity: 0;
    }

}

.container {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    text-align: center;

    position: relative;
    z-index: 1;
}

.card {
    width: 100%;
    max-width: 600px;

    padding: 45px 30px;

    border-radius: 35px;

    background: rgba(255,255,255,0.80);

    backdrop-filter: blur(15px);

    box-shadow: 0 20px 60px rgba(80,30,70,0.25);

    border: 1px solid rgba(255,255,255,0.8);

    animation: appear 0.8s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: scale(0.9) translateY(30px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }

}

h1 {
    color: #d63384;
    font-size: 42px;
    margin-bottom: 20px;
}

.message {
    font-size: 21px;
    line-height: 1.8;
}

.heart-big {
    font-size: 70px;
    animation: heartbeat 1.5s infinite;
    margin-bottom: 10px;
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

}

.buttons {
    margin-top: 30px;

    display: flex;
    justify-content: center;
    gap: 18px;
}

button {
    padding: 14px 35px;

    border: none;

    border-radius: 30px;

    color: white;

    font-size: 18px;

    cursor: pointer;

    transition: 0.3s;
}

.yes {
    background: linear-gradient(90deg, #ff4f9a, #a855f7);

    box-shadow: 0 8px 20px rgba(168,85,247,0.3);
}

.no {
    background: #777;

    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

button:hover {
    transform: scale(1.07);
}

@media(max-width:600px) {

    h1 {
        font-size: 32px;
    }

    .message {
        font-size: 18px;
    }

    .card {
        padding: 35px 20px;
    }

    .buttons {
        gap: 12px;
    }

    button {
        padding: 13px 27px;
        font-size: 17px;
    }

}

</style>
</head>

<body>

<div class="heart">❤️</div>
<div class="heart">💕</div>
<div class="heart">💗</div>
<div class="heart">💖</div>
<div class="heart">💞</div>


<div class="container">

<div class="card">

<div class="heart-big">
❤️
</div>

<h1>Hi Cutie Pattootie 🥺</h1>

<div class="message">

Welcome to<br>

<strong>Andhuu's Heart ❤️</strong>

<br><br>

Do you want to continue? 👀❤️

</div>


<div class="buttons">

<button class="yes" onclick="yesClicked()">
YES ❤️
</button>

<button class="no" onclick="noClicked()">
NO 😌
</button>

</div>

</div>

</div>


<script>

function yesClicked() {

    document.querySelector(".card").innerHTML = `

        <div class="heart-big">💗</div>

        <h1>You chose YES! 🥺❤️</h1>

        <div class="message">

        Okayyy cutie pattootie... 👀

        <br><br>

        Welcome inside Andhuu's Heart. ❤️

        <br><br>

        <strong>
        Your surprises are waiting...
        </strong>

        <br><br>

        <button class="yes" onclick="nextSurprise()">
        Continue ❤️
        </button>

        </div>

    `;

}

function noClicked() {

    document.querySelector(".card").innerHTML = `

        <div class="heart-big">🥺</div>

        <h1>Hehe nice try! 😭❤️</h1>

        <div class="message">

        Sorryyy cutie pattootie...

        <br><br>

        You must continue. 😂❤️

        <br><br>

        There's no escape from Andhuu's Heart. 😌💗

        <br><br>

        <button class="yes" onclick="continueAnyway()">
        Okay fine 😭❤️
        </button>

        </div>

    `;

}

function continueAnyway() {

    yesClicked();

}

function nextSurprise() {

    alert("Surprise section coming next! 👀❤️");

}

</script>

</body>
</html>
