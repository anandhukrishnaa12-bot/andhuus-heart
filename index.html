<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andhuu's Heart ❤️</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow-x: hidden;
}

.card {
    width: 92%;
    max-width: 700px;
    padding: 35px 25px;
    border-radius: 30px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    text-align: center;
    animation: fadeIn 0.8s ease;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

h2 {
    font-size: 25px;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

button {
    border: none;
    padding: 14px 25px;
    margin: 10px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    background: white;
    color: #ff4f81;
    font-weight: bold;
    transition: 0.25s;
}

button:hover {
    transform: scale(1.07);
}

.hidden {
    display: none;
}


/* FLOATING HEARTS */

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
    pointer-events: none;
    z-index: 1;
}

@keyframes floatUp {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}


/* QUIZ */

.quiz-option {
    display: block;
    width: 90%;
    max-width: 450px;
    margin: 12px auto;
}

.quiz-option.correct {
    background: #b9ffcf;
    color: #147a35;
}

.quiz-option.wrong {
    background: #ffb3b3;
    color: #9b1c1c;
}

.progress {
    margin-top: 15px;
    font-size: 15px;
    opacity: 0.9;
}


/* ENVELOPE */

.envelope {
    font-size: 90px;
    cursor: pointer;
    transition: 0.3s;
    margin: 20px;
}

.envelope:hover {
    transform: scale(1.12) rotate(-3deg);
}


/* MEMORY BOXES */

.memory-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-top: 25px;
}

.memory-box {
    height: 150px;
    border-radius: 22px;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.45);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
    padding: 15px;
}

.memory-box:hover {
    transform: translateY(-7px) scale(1.03);
    background: rgba(255,255,255,0.3);
}

.memory-icon {
    font-size: 50px;
    margin-bottom: 8px;
}

.memory-title {
    font-size: 17px;
    font-weight: bold;
}

.memory-reveal {
    display: none;
    margin-top: 25px;
    padding: 22px;
    border-radius: 20px;
    background: rgba(255,255,255,0.22);
}

.memory-reveal.show {
    display: block;
    animation: popIn 0.5s ease;
}


/* MYSTERY BOXES */

.mystery-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 30px;
}

.mystery-box {
    min-height: 170px;
    border-radius: 25px;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.45);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.35s;
    padding: 15px;
}

.mystery-box:hover {
    transform: translateY(-8px) scale(1.04);
    background: rgba(255,255,255,0.3);
}

.mystery-icon {
    font-size: 60px;
    margin-bottom: 10px;
}

.mystery-title {
    font-size: 16px;
    font-weight: bold;
}

.mystery-box.opened {
    opacity: 0.45;
    transform: scale(0.95);
    pointer-events: none;
}

.mystery-reveal {
    display: none;
    margin-top: 25px;
    padding: 25px;
    border-radius: 22px;
    background: rgba(255,255,255,0.22);
}

.mystery-reveal.show {
    display: block;
    animation: popIn 0.5s ease;
}

.mystery-reveal h3 {
    font-size: 25px;
    margin-top: 0;
}

.unlock-message {
    margin-top: 20px;
    animation: popIn 0.6s ease;
}


/* PHOTO GALLERY */

.gallery {
    position: relative;
    margin-top: 25px;
}

.photo-frame {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 10px;
    background: rgba(255,255,255,0.25);
    border-radius: 25px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}

.photo-frame img {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    border-radius: 18px;
    display: block;
    background: rgba(0,0,0,0.08);
}

.photo-number {
    margin-top: 15px;
    font-size: 15px;
    opacity: 0.9;
}

.photo-message {
    margin-top: 15px;
    padding: 18px;
    border-radius: 20px;
    background: rgba(255,255,255,0.18);
    animation: fadeIn 0.5s ease;
}

.gallery-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
}

.final-message {
    margin-top: 25px;
    padding: 25px;
    border-radius: 25px;
    background: rgba(255,255,255,0.2);
    animation: popIn 0.7s ease;
}


/* ================================================= */
/* FINAL HEART WINDOW */
/* ================================================= */

.final-heart-window {

    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background:
        radial-gradient(circle at center,
        rgba(255,60,110,0.20) 0%,
        rgba(80,20,70,0.25) 30%,
        rgba(15,5,25,0.96) 75%);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-y: auto;

    z-index: 9999;

    animation: finalWindowIn 0.8s ease;
}

.final-heart-content {

    width: 92%;
    max-width: 750px;

    min-height: 100%;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 50px 20px;

    position: relative;
}

.final-small-title {

    font-size: 15px;
    letter-spacing: 4px;
    opacity: 0.8;

    margin-bottom: 15px;
}

.final-heart-content h1 {

    font-size: 34px;

    text-shadow:
        0 0 10px rgba(255,100,150,0.8),
        0 0 25px rgba(255,50,120,0.5);
}

.final-heart-content p {

    font-size: 18px;

    opacity: 0.9;
}


/* GIANT HEART */

.giant-heart {

    position: relative;

    width: 190px;
    height: 190px;

    margin: 65px 0 40px;

    transform: rotate(-45deg);

    background: #ff1744;

    cursor: pointer;

    border-radius: 18px;

    box-shadow:
        0 0 15px #ff1744,
        0 0 35px #ff1744,
        0 0 70px rgba(255,23,68,0.9),
        0 0 120px rgba(255,23,68,0.55);

    animation:
        giantHeartbeat 1.5s ease-in-out infinite;

    transition: 0.4s;
}

.giant-heart::before,
.giant-heart::after {

    content: "";

    position: absolute;

    width: 190px;
    height: 190px;

    background: #ff1744;

    border-radius: 50%;
}

.giant-heart::before {

    top: -95px;
    left: 0;
}

.giant-heart::after {

    top: 0;
    left: 95px;
}

.giant-heart span {

    position: absolute;

    left: 63px;
    top: 70px;

    transform: rotate(45deg);

    font-size: 55px;

    z-index: 5;

    filter:
        drop-shadow(0 0 8px white);
}

.giant-heart:hover {

    transform:
        rotate(-45deg)
        scale(1.12);

    box-shadow:
        0 0 25px #ff1744,
        0 0 60px #ff1744,
        0 0 110px rgba(255,23,68,1),
        0 0 160px rgba(255,23,68,0.7);
}

@keyframes giantHeartbeat {

    0%,
    100% {
        transform: rotate(-45deg) scale(1);
    }

    50% {
        transform: rotate(-45deg) scale(1.08);
    }
}


/* HEART GLOW */

.heart-glow {

    position: absolute;

    width: 260px;
    height: 260px;

    left: -35px;
    top: -35px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,80,130,0.25),
            transparent 65%
        );

    filter: blur(15px);

    pointer-events: none;
}


/* TOUCH TEXT */

.touch-heart {

    font-size: 19px !important;

    animation:
        touchPulse 1.5s ease-in-out infinite;
}

@keyframes touchPulse {

    0%,
    100% {
        opacity: 0.55;
    }

    50% {
        opacity: 1;
    }
}


/* FINAL REVEAL */

.reveal-window {

    background:
        radial-gradient(
            circle at center top,
            rgba(255,80,130,0.35),
            rgba(40,5,35,0.95) 65%
        );
}

.heart-reveal-content {

    width: 94%;
    max-width: 800px;

    padding: 50px 15px 70px;

    text-align: center;

    animation: revealContent 1.2s ease;
}

.heart-burst {

    font-size: 35px;

    letter-spacing: 12px;

    animation: burstIn 1s ease;
}

.final-love-title {

    font-size: 34px;

    margin: 20px 0 5px;

    text-shadow:
        0 0 10px #ff6b9a,
        0 0 25px #ff1744;
}

.final-love-subtitle {

    font-size: 19px;

    opacity: 0.9;
}


/* PHOTOS */

.heart-photo-reveal {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;

    margin: 35px auto;

    width: 100%;
}

.reveal-photo {

    position: relative;

    padding: 6px;

    border-radius: 25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.8),
            rgba(255,100,150,0.6)
        );

    box-shadow:
        0 8px 25px rgba(0,0,0,0.4),
        0 0 20px rgba(255,70,130,0.25);

    animation: photoReveal 0.8s ease backwards;
}

.reveal-photo:nth-child(1) {
    animation-delay: 0.15s;
}

.reveal-photo:nth-child(2) {
    animation-delay: 0.3s;
}

.reveal-photo:nth-child(3) {
    animation-delay: 0.45s;
}

.reveal-photo:nth-child(4) {
    animation-delay: 0.6s;
}

.reveal-photo:nth-child(5) {
    animation-delay: 0.75s;
}

.reveal-photo:nth-child(6) {
    animation-delay: 0.9s;
}

.reveal-photo img {

    width: 100%;
    height: 210px;

    object-fit: cover;

    display: block;

    border-radius: 19px;
}

@keyframes photoReveal {

    from {
        opacity: 0;
        transform:
            scale(0.4)
            rotate(-8deg);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            rotate(0);
    }
}


/* MESSAGE INSIDE HEART */

.final-love-message {

    margin-top: 25px;

    padding: 35px 25px;

    border-radius: 35px;

    background:
        rgba(255,255,255,0.10);

    border:
        1px solid rgba(255,255,255,0.25);

    box-shadow:
        inset 0 0 30px rgba(255,100,150,0.08),
        0 15px 40px rgba(0,0,0,0.3);

    animation: messageReveal 1.5s ease;
}

.tiny-heart {

    font-size: 45px;

    animation:
        tinyBeat 1.3s infinite;
}

.final-love-message h2 {

    font-size: 28px;

    margin: 10px 0 20px;
}

.big-final-text {

    font-size: 32px;

    font-weight: bold;

    margin: 20px 0;

    text-shadow:
        0 0 10px #ff6b9a,
        0 0 25px #ff1744;
}

.final-love-message p {

    font-size: 18px;

    line-height: 1.7;
}

@keyframes tinyBeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}


/* FINAL ANIMATIONS */

@keyframes finalWindowIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes revealContent {

    from {
        opacity: 0;
        transform: scale(0.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes burstIn {

    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes messageReveal {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* GENERAL ANIMATIONS */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes popIn {

    from {
        opacity: 0;
        transform: scale(0.8);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* MOBILE */

@media (max-width: 600px) {

    .card {
        padding: 28px 17px;
    }

    h1 {
        font-size: 27px;
    }

    h2 {
        font-size: 22px;
    }

    p {
        font-size: 16px;
    }

    .memory-container {
        grid-template-columns: 1fr;
    }

    .mystery-container {
        grid-template-columns: 1fr;
    }

    .mystery-box {
        min-height: 140px;
    }

    .giant-heart {

        width: 145px;
        height: 145px;

        margin-top: 55px;
    }

    .giant-heart::before,
    .giant-heart::after {

        width: 145px;
        height: 145px;
    }

    .giant-heart::before {
        top: -72px;
    }

    .giant-heart::after {
        left: 72px;
    }

    .giant-heart span {

        left: 47px;
        top: 52px;

        font-size: 42px;
    }

    .heart-photo-reveal {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }

    .reveal-photo img {

        height: 170px;
    }

    .final-love-title {

        font-size: 28px;
    }

    .big-final-text {

        font-size: 27px;
    }

    .final-love-message {

        padding: 28px 18px;
    }
}

</style>
</head>

<body>

<div class="card" id="app"></div>


<script>


/* ========================================= */
/* FLOATING HEARTS */
/* ========================================= */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML =
        Math.random() > 0.5 ? "❤️" : "💗";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {

        heart.remove();

    }, 8000);
}

setInterval(createHeart, 700);



/* ========================================= */
/* OPENING */
/* ========================================= */

function startPage() {

    document.getElementById("app").innerHTML = `

        <h1>
            Hi Cutie Pattootie 🥺❤️
        </h1>

        <p>
            Welcome to <b>Andhuu's Heart ❤️</b>
        </p>

        <p>
            There's something waiting for you inside... 👀💗
        </p>

        <h2>
            Do you want to continue? 👀❤️
        </h2>

        <button onclick="startJourney()">
            YES ❤️
        </button>

        <button onclick="noButton()">
            NO 😌
        </button>

    `;
}


function startJourney() {

    showQuizIntro();

}


function noButton() {

    document.getElementById("app").innerHTML = `

        <h1>
            Hehe nice try! 😭❤️
        </h1>

        <p>
            Sorryyy cutie pattootie... 🥺
        </p>

        <p>
            You must continue. 😂❤️
        </p>

        <p>
            There's no escape from Andhuu's Heart. 😌💗
        </p>

        <button onclick="showQuizIntro()">
            Okay fine 😭❤️
        </button>

    `;
}



/* ========================================= */
/* QUIZ INTRO */
/* ========================================= */

function showQuizIntro() {

    document.getElementById("app").innerHTML = `

        <h1>
            Surprise 1 👀❤️
        </h1>

        <h2>
            How well do you know Andhuu? 🥺
        </h2>

        <p>
            Let's see if you can answer these questions correctly. 😌❤️
        </p>

        <p>
            Don't worry...
            I think you already know the answers. 👀😂
        </p>

        <button onclick="startQuiz()">
            Start Quiz ❤️
        </button>

    `;
}



/* ========================================= */
/* QUIZ */
/* ========================================= */

const questions = [

    {
        question:
            "Who is the most special person in Andhuu's heart? 🥺❤️",

        options: [
            "His friends 😂",
            "His phone 📱",
            "Kenzaaa ❤️",
            "Food 🍕"
        ],

        answer: 2
    },

    {
        question:
            "Who can make Andhuu smile even on his worst days? 🥹❤️",

        options: [
            "Kenzaaa ❤️",
            "A good nap 😴",
            "A new phone 📱",
            "Money 💰"
        ],

        answer: 0
    },

    {
        question:
            "Who would Andhuu choose to spend his happiest moments with? 👀❤️",

        options: [
            "His friends 😂",
            "Food 🍗",
            "His phone 📱",
            "Kenzaaa ❤️"
        ],

        answer: 3
    },

    {
        question:
            "Who has a permanent place inside Andhuu's heart? 💗",

        options: [
            "Nobody 😭",
            "His favourite celebrity ⭐",
            "Kenzaaa ❤️",
            "His gaming squad 🎮"
        ],

        answer: 2
    },

    {
        question:
            "FINAL QUESTION... Who is the MOST OBVIOUS answer to everything in Andhuu's heart? 😭❤️",

        options: [
            "Food 🍕",
            "Money 💰",
            "His phone 📱",
            "Obviously Kenzaaa ❤️"
        ],

        answer: 3
    }

];


let currentQuestion = 0;

let score = 0;


function startQuiz() {

    currentQuestion = 0;

    score = 0;

    showQuestion();

}


function showQuestion() {

    const q =
        questions[currentQuestion];

    let optionsHTML = "";

    q.options.forEach((option, index) => {

        optionsHTML += `

            <button
                class="quiz-option"
                onclick="answer(${index})"
                id="option${index}">

                ${option}

            </button>

        `;

    });


    document.getElementById("app").innerHTML = `

        <h1>
            How well do you know Andhuu? 👀❤️
        </h1>

        <h2>
            ${q.question}
        </h2>

        ${optionsHTML}

        <div class="progress">
            Question ${currentQuestion + 1} /
            ${questions.length}
        </div>

    `;
}


function answer(selected) {

    const q =
        questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".quiz-option");

    buttons.forEach(button => {

        button.disabled = true;

    });


    if (selected === q.answer) {

        score++;

        buttons[selected]
            .classList.add("correct");

        setTimeout(() => {

            nextQuestion();

        }, 700);

    }

    else {

        buttons[selected]
            .classList.add("wrong");

        buttons[q.answer]
            .classList.add("correct");

        setTimeout(() => {

            nextQuestion();

        }, 1000);

    }
}


function nextQuestion() {

    currentQuestion++;

    if (
        currentQuestion <
        questions.length
    ) {

        showQuestion();

    }

    else {

        finishQuiz();

    }
}


function finishQuiz() {

    document.getElementById("app").innerHTML = `

        <h1>
            Quiz Complete! 🎉❤️
        </h1>

        <h2>
            ${score} / ${questions.length} correct 🥺
        </h2>

        <p>
            And honestly...
        </p>

        <p>
            The answer was always...
        </p>

        <h1>
            Kenzaaa. 🥺❤️
        </h1>

        <button onclick="nextSurprise()">
            Next Surprise 👀❤️
        </button>

    `;
}



/* ========================================= */
/* SURPRISE 2 */
/* ========================================= */

function nextSurprise() {

    document.getElementById("app").innerHTML = `

        <h1>
            Surprise 2 💌
        </h1>

        <h2>
            There's something waiting for you...
        </h2>

        <div
            class="envelope"
            onclick="openEnvelope()">

            💌

        </div>

        <p>
            Tap the envelope 👀❤️
        </p>

    `;
}


function openEnvelope() {

    document.getElementById("app").innerHTML = `

        <h1>
            Kenzaaa ❤️
        </h1>

        <p>
            If you're reading this...
        </p>

        <p>
            just know that somewhere in this little website,
            there is a boy who made every single part of it
            thinking about you. 🥺
        </p>

        <p>
            You are not just a name on this screen.
            You're the reason I wanted to make this whole
            little journey. ❤️
        </p>

        <p>
            And this isn't even the end...
            👀❤️
        </p>

        <button onclick="surpriseThree()">
            Keep going 👀💗
        </button>

    `;
}



/* ========================================= */
/* SURPRISE 3 */
/* ========================================= */

let memoriesOpened = 0;


const memories = [

    {
