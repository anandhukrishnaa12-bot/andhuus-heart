<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andhuu's Heart ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    color: #5a1830;
    min-height: 100vh;
    overflow-x: hidden;
}

#app {
    min-height: 100vh;
}

.screen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    text-align: center;
}

.card {
    width: 100%;
    max-width: 650px;
    background: rgba(255,255,255,0.92);
    padding: 35px 25px;
    border-radius: 30px;
    box-shadow: 0 15px 45px rgba(120,0,40,0.2);
    animation: fadeIn 0.7s ease;
}

h1 {
    font-size: 2.4rem;
    margin-bottom: 18px;
}

h2 {
    font-size: 1.8rem;
    margin-bottom: 18px;
}

p {
    font-size: 1.1rem;
    line-height: 1.7;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 14px 24px;
    margin: 8px;
    border-radius: 30px;
    background: #ff4f81;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 6px 18px rgba(255,79,129,0.3);
}

button:hover {
    transform: scale(1.06);
    background: #ff2866;
}

.secondary {
    background: #fff0f5;
    color: #d72d61;
}

.option {
    display: block;
    width: 90%;
    max-width: 500px;
    margin: 12px auto;
    background: #fff0f5;
    color: #831d42;
    border: 2px solid #ffc1d2;
    box-shadow: none;
}

.option:hover {
    background: #ffdce8;
}

.correct {
    background: #6fd08c !important;
    color: white !important;
}

.wrong {
    background: #ff7b91 !important;
    color: white !important;
}

.progress {
    margin-bottom: 20px;
    font-weight: bold;
    color: #d52d62;
}

.envelope {
    font-size: 7rem;
    cursor: pointer;
    animation: float 2s infinite ease-in-out;
    margin: 20px;
}

.memory-grid,
.box-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin: 25px 0;
}

.memory-box,
.mystery-box {
    min-height: 150px;
    border-radius: 25px;
    background: linear-gradient(145deg, #ffb6c9, #ff6f9c);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(160,0,60,0.18);
    transition: 0.3s;
}

.memory-box:hover,
.mystery-box:hover {
    transform: translateY(-6px) scale(1.02);
}

.memory-message,
.box-message {
    display: none;
    margin-top: 12px;
    font-size: 0.95rem;
}

.opened {
    background: linear-gradient(145deg, #ff6f91, #ff3d6e);
}

.gallery {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.gallery img {
    width: 100%;
    max-width: 430px;
    max-height: 520px;
    object-fit: contain;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(80,0,30,0.25);
    margin-bottom: 20px;
}

.photo-number {
    font-weight: bold;
    margin-bottom: 10px;
}

.final-gallery-message {
    margin-top: 20px;
}

.final-heart-window {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background:
        radial-gradient(circle at center, rgba(255,70,120,0.3), transparent 35%),
        radial-gradient(circle at center, #351020, #12040b 70%);
    color: white;
    overflow-y: auto;
}

.final-heart-content {
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.final-heart-content h1 {
    color: #fff;
    text-shadow: 0 0 20px #ff4777;
}

.final-heart-content p {
    max-width: 700px;
}

.heart-container {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 35px auto;
}

.heart-glow {
    position: absolute;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: rgba(255,20,80,0.45);
    filter: blur(45px);
    animation: glowPulse 1.5s infinite alternate;
}

.giant-heart {
    position: relative;
    width: 155px;
    height: 155px;
    background: #ff1744;
    transform: rotate(-45deg);
    box-shadow:
        0 0 20px #ff1744,
        0 0 45px #ff1744,
        0 0 80px rgba(255,23,68,0.8);
    cursor: pointer;
    animation: heartbeat 1.2s infinite;
    z-index: 2;
}

.giant-heart::before,
.giant-heart::after {
    content: "";
    position: absolute;
    width: 155px;
    height: 155px;
    background: #ff1744;
    border-radius: 50%;
}

.giant-heart::before {
    top: -77px;
    left: 0;
}

.giant-heart::after {
    left: 77px;
    top: 0;
}

.giant-heart span {
    position: absolute;
    z-index: 5;
    transform: rotate(45deg);
    font-size: 70px;
    left: 42px;
    top: 38px;
}

.heart-hint {
    font-size: 1.2rem;
    animation: pulseText 1.5s infinite;
}

.heart-photo-reveal {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin: 30px auto;
}

.reveal-photo {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 22px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

.reveal-photo img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 17px;
    display: block;
}

.final-love-message {
    max-width: 700px;
    background: rgba(255,255,255,0.1);
    padding: 30px 22px;
    border-radius: 28px;
    margin-top: 25px;
    backdrop-filter: blur(10px);
}

.final-love-message h2 {
    color: #ff8eaa;
    text-shadow: 0 0 15px rgba(255,50,100,0.7);
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-12px);
    }
}

@keyframes heartbeat {
    0%,100% {
        transform: rotate(-45deg) scale(1);
    }
    15% {
        transform: rotate(-45deg) scale(1.12);
    }
    30% {
        transform: rotate(-45deg) scale(1);
    }
    45% {
        transform: rotate(-45deg) scale(1.08);
    }
}

@keyframes glowPulse {
    from {
        transform: scale(0.9);
        opacity: 0.5;
    }
    to {
        transform: scale(1.15);
        opacity: 0.9;
    }
}

@keyframes pulseText {
    0%,100% {
        opacity: 0.6;
    }
    50% {
        opacity: 1;
    }
}

@media(max-width:600px) {
    h1 {
        font-size: 1.9rem;
    }

    h2 {
        font-size: 1.5rem;
    }

    p {
        font-size: 1rem;
    }

    .memory-grid,
    .box-grid {
        grid-template-columns: 1fr;
    }

    .heart-photo-reveal {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .reveal-photo img {
        height: 190px;
    }

    .heart-container {
        transform: scale(0.9);
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const app = document.getElementById("app");

/* =========================
   SURPRISE 5 PHOTOS
   ========================= */

const galleryPhotos = [
    "WhatsApp Image 2026-10-03 at 1.45.40 PM (1).jpeg",
    "WhatsApp Image 2026-10-03 at 1.45.40 PM.jpeg",
    "WhatsApp Image 2026-10-03 at 1.47.42 PM.jpeg",
    "WhatsApp Image 2026-10-03 at 12.00.20 PM.jpeg",
    "WhatsApp Image 2026-10-03 at 12.00.21 PM.jpeg",
    "WhatsApp Image 2026-10-03 at 12.01.53 PM.jpeg"
];

const galleryMessages = [
    "One picture... one little moment... and somehow it becomes a memory I want to keep forever. 🥺❤️",
    "Some photos don't need a perfect caption. Having you in them is already enough. 💗",
    "If I could pause time and keep certain moments forever, I'd definitely keep moments like this. 🥹❤️",
    "A little piece of our story, saved in one picture. 📸❤️",
    "Years from now, I hope these little pictures still make me smile the same way. 🥺💗",
    "And if someone ever asks me what made these memories special... I'd simply say: Kenzaaa. ❤️"
];

/* =========================
   FINAL HEART PHOTOS
   ========================= */

const heartPhotos = [
    "WhatsApp Image 2026-10-03 at 2.15.37 PM.jpeg",
    "WhatsApp Image 2026-10-03 at 2.15.36 PM (2).jpeg",
    "WhatsApp Image 2026-10-03 at 2.15.36 PM (1).jpeg",
    "WhatsApp Image 2026-10-03 at 2.15.36 PM.jpeg",
    "WhatsApp Image 2026-10-03 at 2.15.35 PM.jpeg"
];

/* =========================
   OPENING
   ========================= */

function startPage() {

    app.innerHTML = `
        <div class="screen">
            <div class="card">

                <h1>Hi Cutie Pattootie 🥺❤️</h1>

                <h2>Welcome to Andhuu's Heart ❤️</h2>

                <p>
                    I made a little something for you...
                    but you have to promise me you'll explore everything. 👀💗
                </p>

                <p><b>Do you want to continue? 👀❤️</b></p>

                <button onclick="surpriseOne()">YES ❤️</button>
                <button class="secondary" onclick="noButton()">NO 😭</button>

            </div>
        </div>
    `;
}

function noButton() {

    app.innerHTML = `
        <div class="screen">
            <div class="card">

                <h1>Hehe nice try! 😭❤️</h1>

                <p>Sorryyy cutie pattootie...</p>
                <p><b>You must continue. 😂❤️</b></p>

                <p>There's no escape from Andhuu's Heart. 😌💗</p>

                <p>Okay fine 😭❤️</p>

                <button onclick="surpriseOne()">Continue 👀❤️</button>

            </div>
        </div>
    `;
}

/* =========================
   SURPRISE 1 - QUIZ
   ========================= */

const questions = [
    {
        q: "Who is the most special person in Andhuu's heart? 🥺❤️",
        options: ["His friends 😂", "His phone 📱", "Kenzaaa ❤️", "Food 🍕"],
        answer: 2
    },
    {
        q: "Who can make Andhuu smile even on his worst days? 🥹❤️",
        options: ["Kenzaaa ❤️", "A good nap 😴", "A new phone 📱", "Money 💰"],
        answer: 0
    },
    {
        q: "Who would Andhuu choose to spend his happiest moments with? 👀❤️",
        options: ["His friends 😂", "Food 🍗", "His phone 📱", "Kenzaaa ❤️"],
        answer: 3
    },
    {
        q: "Who has a permanent place inside Andhuu's heart? 💗",
        options: ["Nobody 😭", "His favourite celebrity ⭐", "Kenzaaa ❤️", "His gaming squad 🎮"],
        answer: 2
    },
    {
        q: "FINAL QUESTION... Who is the MOST OBVIOUS answer to everything in Andhuu's heart? 😭❤️",
        options: ["Food 🍕", "Money 💰", "His phone 📱", "Obviously Kenzaaa ❤️"],
        answer: 3
    }
];

let questionIndex = 0;
let quizScore = 0;

function surpriseOne() {

    questionIndex = 0;
    quizScore = 0;

    showQuestion();
}

function showQuestion() {

    const q = questions[questionIndex];

    app.innerHTML = `
        <div class="screen">
            <div class="card">

                <div class="progress">
                    Question ${questionIndex + 1} / ${questions.length}
                </div>

                <h1>Surprise 1 👀❤️</h1>

                <h2>How well do you know Andhuu? 👀</h2>

                <p>${q.q}</p>

                <div>
                    ${q.options.map((option, i) => `
                        <button class="option" onclick="answerQuestion(${i})">
                            ${option}
                        </button>
                    `).join("")}
                </div>

            </div>
        </div>
    `;
}

function answerQuestion(selected) {

    const q = questions[questionIndex];

    if (selected === q.answer) {
        quizScore++;
    }

    questionIndex++;

    if (questionIndex < questions.length) {

        setTimeout(() => {
            showQuestion();
        }, 350);

    } else {

        setTimeout(() => {
            showQuizResult();
        }, 350);
    }
}

function showQuizResult() {

    app.innerHTML = `
        <div class="screen">
            <div class="card">

                <h1>You finished! 😭❤️</h1>

                <h2>${quizScore}/${questions.length} correct 👀</h2>

                <p>
                    But honestly...
                    there was only one answer I really wanted you to know. 🥺
                </p>

                <h2>Kenzaaa ❤️</h2>

                <button onclick="surpriseTwo()">
                    Surprise 2 💌
                </button>

            </div>
        </div>
    `;
}

/* =========================
   SURPRISE 2 - ENVELOPE
   ========================= */

function surpriseTwo() {

    app.innerHTML = `
        <div class="screen">
            <div class="card">

                <h1>Surprise 2 💌❤️</h1>

                <p>There's a little message waiting for you...</p>

                <div class="envelope" onclick="openEnvelope()">
                    💌
                </div>

                <p><b>Tap the envelope 👀</b></p>

            </div>
        </div>
    `;
}

function openEnvelope() {

    app.innerHTML = `
        <div class="screen">
            <div class="card">

                <h1>💌</h1>

                <h2>Kenzaaa ❤️</h2>

                <p>
                    If you're reading this...
                    just know that somewhere in this little website,
                    there is a boy who made every single part of it thinking about you. 🥺
                </p>

                <p>
                    You are not just a name on this screen.
                    You're the reason I wanted to make this whole little journey. ❤️
                </p>

                <p>
                    And this isn't even the end...
                    👀❤️
                </p>

                <button onclick="surpriseThree()">
                    Keep going 👀💗
                </button>

            </div>
        </div>
    `;
}

/* =========================
   SURPRISE 3
   ========================= */

const memories = [
    {
        title: "🎁 A Little Thought",
        message: "Some memories may look small from the outside... but when they involve you, they become special to me. 🥺❤️"
    },
    {
        title: "💌 Something Special",
        message: "My favourite part of so many moments isn't what happened... it's the fact that you were there. 💗"
    },
    {
        title: "😂 Our Silly Side",
        message: "Even the random, silly and completely unnecessary moments become memories I would happily experience again with you. 😂❤️"
    },
    {
        title: "❤️ One Truth",
        message: "No matter how many surprises I make, there's always one person behind the reason I made them. Kenzaaa. ❤️"
    }
];

let openedMemories = 0;

function surpriseThree() {

    openedMemories = 0;

    app.innerHTML = `
        <div class="screen">
            <div class="card">

                <h1>Surprise 3 📸❤️</h1>

                <h2>Our Little Memories 🥺</h2>

                <p>
                    Okay Kenzaaa...
                    let's open these little surprises one by one. 👀💗
                </p>

                <div class="memory-grid">

                    ${memories.map((memory, i) => `
                        <div class="memory-box" onclick="openMemory(${i}, this)">
                            <strong>${memory.title}</strong>
                            <div class="memory-message">
                                ${memory.message}
                            </div>
                        </div>
                    `).join("")}

                </div>

                <div id="memoryNext"></div>

            </div>
        </div>
    `;
}

function openMemory(index, element) {

    const message = element.querySelector(".memory-message");

    if (message.style.display === "block") return;

    message.style.display = "block";
    element.classList.add("opened");

    openedMemories++;

    if (openedMemories === memories.length) {

        document.getElementById("memoryNext").innerHTML = `
            <button onclick="surpriseFour()">
                Next Surprise 👀❤️
            </button>
        `;
    }
}

/* =========================
   SURPRISE 4
   ========================= */

const mysteryMessages = [
    "If I could collect every little moment that made me smile because of you, I would probably need an entire website just for them. 🥺❤️",
    "You somehow became one of the most important parts of my little world. And that's something I will always be grateful for. ❤️",
    "I don't know how many surprises this website will eventually have... but every single one will have one thing in common — you. Kenzaaa. 🥺❤️"
];

let openedBoxes = 0;

function surpriseFour() {

    openedBoxes = 0;

    app.innerHTML = `
        <div class="screen">
            <div class="card">

                <h1>Surprise 4 🎁❤️</h1>

                <h2>Choose a Mystery Box 👀</h2>

                <p>Hmm... there are three boxes.</p>
                <p>But I didn't tell you what's inside. 😌</p>
                <p>Choose one... or open all three. 👀❤️</p>

                <div class="box-grid">

                    ${mysteryMessages.map((message, i) => `
                        <div class="mystery-box" onclick="openMystery(${i}, this)">
                            <strong>
                                ${i === 0 ? "🎁 Box 1" : i === 1 ? "💌 Box 2" : "❤️ Box 3"}
                            </strong>

                            <div class="box-message">
                                ${message}
                            </div>
                        </div>
                    `).join("")}

                </div>

                <div id="boxNext"></div>

            </div>
        </div>
    `;
}

function openMystery(index, element) {

    const message = element.querySelector(".box-message");

    if (message.style.display === "block") return;

    message.style.display = "block";
    element.classList.add("opened");

    openedBoxes++;

    if (openedBoxes === 3) {

        document.getElementById("boxNext").innerHTML = `
            <p><b>You opened everything! 😭❤️</b></p>

            <p>
                But there's still something waiting deeper inside
                Andhuu's Heart... 👀
            </p>

            <button onclick="surpriseFive()">
                Go Deeper ❤️
            </button>
        `;
    }
}

/* =========================
   SURPRISE 5 - GALLERY
   ========================= */

let currentPhoto = 0;

function surpriseFive() {

    currentPhoto = 0;

    showPhoto();
}

function showPhoto() {

    const photo = galleryPhotos[currentPhoto];
    const message = galleryMessages[currentPhoto];

    app.innerHTML = `
        <div class="screen">
            <div class="card">

                <h1>Surprise 5 📸❤️</h1>

                <h2>Little Pieces of Us 🥺</h2>

                <p>
                    I wanted to save a few little moments here...
                </p>

                <div class="gallery">

                    <div class="photo-number">
                        Photo ${currentPhoto + 1} / ${galleryPhotos.length}
                    </div>

                    <img src="${photo}" alt="Our memory">

                    <p>${message}</p>

                    <div>

                        ${
                            currentPhoto > 0
                            ? `<button onclick="previousPhoto()">⬅️ Previous</button>`
                            : ""
                        }

                        ${
                            currentPhoto < galleryPhotos.length - 1
                            ? `<button onclick="nextPhoto()">Next ➡️</button>`
                            : `<button onclick="finalGalleryMessage()">Reveal What's Inside ❤️</button>`
                        }

                    </div>

                </div>

            </div>
        </div>
    `;
}

function nextPhoto() {

    if (currentPhoto < galleryPhotos.length - 1) {
        currentPhoto++;
        showPhoto();
    }
}

function previousPhoto() {

    if (currentPhoto > 0) {
        currentPhoto--;
        showPhoto();
    }
}

function finalGalleryMessage() {

    app.innerHTML = `
        <div class="screen">
            <div class="card">

                <h1>That's all the pictures... for now. 👀❤️</h1>

                <p>
                    But there's something I want you to know. 🥺
                </p>

                <p>
                    These pictures are only little pieces of the memories we've made.
                    There are still so many moments, laughs, conversations and memories
                    waiting for us. ❤️
                </p>

                <p>
                    And this website isn't finished yet...
                </p>

                <p>
                    There's one final secret hidden inside Andhuu's Heart. 👀❤️
                </p>

                <button onclick="surpriseSix()">
                    Find the Final Secret ❤️
                </button>

            </div>
        </div>
    `;
}

/* =========================
   SURPRISE 6 - FINAL HEART
   ========================= */

function surpriseSix() {

    app.innerHTML = `
        <div class="final-heart-window">

            <div class="final-heart-content">

                <p>❤️ 💗 ❤️</p>

                <h1>Surprise 6 ❤️</h1>

                <h2>There's something inside my heart...</h2>

                <p>
                    You've come all the way here, Kenzaaa. 🥺
                </p>

                <p>
                    But I saved one last thing just for you.
                </p>

                <div class="heart-container">

                    <div class="heart-glow"></div>

                    <div class="giant-heart" onclick="openFinalHeart()">
                        <span>❤️</span>
                    </div>

                </div>

                <div class="heart-hint">
                    Touch the heart ❤️
                </div>

            </div>

        </div>
    `;
}

/* =========================
   FINAL HEART REVEAL
   ========================= */

function openFinalHeart() {

    app.innerHTML = `
        <div class="final-heart-window">

            <div class="final-heart-content">

                <p style="font-size:2rem;">
                    ❤️ 💗 ❤️
                </p>

                <h1>You found what's inside... 🥺</h1>

                <h2>And now there's no secret anymore. ❤️</h2>

                <div class="heart-photo-reveal">

                    ${heartPhotos.map(photo => `
                        <div class="reveal-photo">
                            <img src="${photo}" alt="Kenzaaa ❤️">
                        </div>
                    `).join("")}

                </div>

                <div class="final-love-message">

                    <h2>Inside Andhuu's Heart...</h2>

                    <h1>There's only Kenzaaa. ❤️</h1>

                    <p>
                        All these little surprises,
                        every picture, every word...
                    </p>

                    <p>
                        They all lead to the same person.
                    </p>

                    <p>
