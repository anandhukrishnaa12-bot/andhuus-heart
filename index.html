<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Andhuu's Heart ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #ffb6d5, #d8b4fe, #ffc6d9);
    color: #4b2142;
    overflow: hidden;
}

/* Floating hearts */

.heart {
    position: fixed;
    bottom: -40px;
    font-size: 25px;
    animation: float 8s linear infinite;
    opacity: 0.7;
    z-index: 0;
}

.heart:nth-child(1) {
    left: 10%;
    animation-delay: 0s;
}

.heart:nth-child(2) {
    left: 30%;
    animation-delay: 2s;
}

.heart:nth-child(3) {
    left: 50%;
    animation-delay: 4s;
}

.heart:nth-child(4) {
    left: 70%;
    animation-delay: 1s;
}

.heart:nth-child(5) {
    left: 90%;
    animation-delay: 3s;
}

@keyframes float {

    0% {
        transform: translateY(0);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh);
        opacity: 0;
    }

}

/* Main */

.container {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    text-align: center;

    position: relative;
    z-index: 1;
}

.card {
    width: 100%;
    max-width: 620px;

    padding: 40px 28px;

    border-radius: 35px;

    background: rgba(255,255,255,0.82);

    backdrop-filter: blur(15px);

    box-shadow: 0 20px 60px rgba(80,30,70,0.25);

    border: 1px solid rgba(255,255,255,0.8);

    animation: appear 0.7s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: scale(0.9) translateY(25px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }

}

/* Text */

h1 {
    color: #d63384;
    font-size: 38px;
    margin-bottom: 20px;
}

h2 {
    color: #d63384;
    font-size: 30px;
}

.message {
    font-size: 20px;
    line-height: 1.8;
}

/* Heart */

.heart-big {
    font-size: 65px;
    animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

}

/* Buttons */

.answers {
    display: flex;
    flex-direction: column;
    gap: 13px;

    margin-top: 28px;
}

button {
    width: 100%;

    padding: 14px 20px;

    border: none;
    border-radius: 25px;

    background: linear-gradient(90deg, #ff4f9a, #a855f7);

    color: white;

    font-size: 17px;

    cursor: pointer;

    transition: 0.25s;

    box-shadow: 0 7px 18px rgba(168,85,247,0.25);
}

button:hover {
    transform: scale(1.04);
}

/* Progress */

.progress {
    font-size: 14px;
    color: #9b5b89;
    margin-bottom: 12px;
}

/* Mobile */

@media(max-width:600px) {

    h1 {
        font-size: 30px;
    }

    h2 {
        font-size: 25px;
    }

    .message {
        font-size: 18px;
    }

    .card {
        padding: 32px 20px;
    }

}

</style>
</head>

<body>

<!-- Floating hearts -->

<div class="heart">❤️</div>
<div class="heart">💕</div>
<div class="heart">💗</div>
<div class="heart">💖</div>
<div class="heart">💞</div>


<div class="container">

<div class="card" id="game">

<div class="heart-big">
💗
</div>

<h1>How well do you know Andhuu? 👀</h1>

<div class="message">

Let's see if you really know your boy. 😌❤️

<br><br>

No cheating! 😂

</div>

<button onclick="startQuiz()">
I'm Ready ❤️
</button>

</div>

</div>


<script>

/* Questions */

const questions = [

{
    question: "What makes Andhuu happiest? ❤️",

    answers: [
        "Food 🍕",
        "Sleeping 😴",
        "Kenzaaa ❤️",
        "All of the above 😂"
    ],

    correct: 3
},

{
    question: "Who is the special person inside Andhuu's heart? 👀",

    answers: [
        "Nobody 😌",
        "Kenzaaa ❤️",
        "His phone 📱",
        "His gym bro 😂"
    ],

    correct: 1
},

{
    question: "What does Andhuu want the most? 🥺",

    answers: [
        "A million rupees 💰",
        "A new phone 📱",
        "Peace with Kenzaaa ❤️",
        "Unlimited food 🍕"
    ],

    correct: 2
},

{
    question: "Who gets the biggest smile from Andhuu? 😭❤️",

    answers: [
        "His friends",
        "His teachers 😂",
        "Kenzaaa ❤️",
        "Nobody 😭"
    ],

    correct: 2
},

{
    question: "Final question... who does Andhuu love? ❤️",

    answers: [
        "Kenzaaa ❤️",
        "Kenzaaa ❤️",
        "Kenzaaa ❤️",
        "Obviously Kenzaaa 😭❤️"
    ],

    correct: 0
}

];

let currentQuestion = 0;
let score = 0;


/* Start */

function startQuiz() {

    currentQuestion = 0;
    score = 0;

    showQuestion();

}


/* Show question */

function showQuestion() {

    const q = questions[currentQuestion];

    let html = `

        <div class="progress">
        Question ${currentQuestion + 1} of ${questions.length}
        </div>

        <div class="heart-big">💗</div>

        <h2>${q.question}</h2>

        <div class="answers">
    `;

    q.answers.forEach((answer, index) => {

        html += `
            <button onclick="answer(${index})">
                ${answer}
            </button>
        `;

    });

    html += `</div>`;

    document.getElementById("game").innerHTML = html;

}


/* Answer */

function answer(selected) {

    const q = questions[currentQuestion];

    if(selected === q.correct) {

        score++;

        document.getElementById("game").innerHTML = `

            <div class="heart-big">💖</div>

            <h1>Correct! 😭❤️</h1>

            <div class="message">

            You actually know me. 🥺

            <br><br>

            <button onclick="nextQuestion()">
            Continue ❤️
            </button>

            </div>

        `;

    } else {

        document.getElementById("game").innerHTML = `

            <div class="heart-big">😂</div>

            <h1>Wronggg! 😭</h1>

            <div class="message">

            Hmm... do you even know Andhuu? 😂❤️

            <br><br>

            <button onclick="nextQuestion()">
            Try again ❤️
            </button>

            </div>

        `;

    }

}


/* Next */

function nextQuestion() {

    currentQuestion++;

    if(currentQuestion < questions.length) {

        showQuestion();

    } else {

        finishQuiz();

    }

}


/* Finish */

function finishQuiz() {

    document.getElementById("game").innerHTML = `

        <div class="heart-big">💗</div>

        <h1>You finished! 🎉</h1>

        <div class="message">

        Score: <strong>${score}/${questions.length}</strong>

        <br><br>

        Whether you got everything right or not...

        <br>

        there's one thing you definitely should know. ❤️

        <br><br>

        <strong>
        You're the reason this little website exists. 🥺
        </strong>

        <br><br>

        <button onclick="nextSurprise()">
        Next Surprise 👀❤️
        </button>

        </div>

    `;

}


/* Temporary next surprise */

function nextSurprise() {

    alert("Surprise 2 is coming... 👀❤️");

}

</script>

</body>
</html>
