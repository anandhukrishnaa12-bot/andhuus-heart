<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andhuu's Heart ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: white;
}

.card {
    width: 92%;
    max-width: 700px;
    padding: 35px 25px;
    border-radius: 30px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    text-align: center;
    animation: fadeIn 0.8s ease;
}

h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

h2 {
    font-size: 25px;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

button {
    border: none;
    padding: 14px 25px;
    margin: 10px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    background: white;
    color: #ff4f81;
    font-weight: bold;
    transition: 0.25s;
}

button:hover {
    transform: scale(1.07);
}

.hidden {
    display: none;
}

/* Floating hearts */

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
    pointer-events: none;
}

@keyframes floatUp {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Quiz */

.quiz-option {
    display: block;
    width: 90%;
    max-width: 450px;
    margin: 12px auto;
}

.quiz-option.correct {
    background: #b9ffcf;
    color: #147a35;
}

.quiz-option.wrong {
    background: #ffb3b3;
    color: #9b1c1c;
}

.progress {
    margin-top: 15px;
    font-size: 15px;
    opacity: 0.9;
}

/* Envelope */

.envelope {
    font-size: 90px;
    cursor: pointer;
    transition: 0.3s;
    margin: 20px;
}

.envelope:hover {
    transform: scale(1.12) rotate(-3deg);
}

/* Memory boxes */

.memory-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-top: 25px;
}

.memory-box {
    height: 150px;
    border-radius: 22px;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.45);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
    padding: 15px;
}

.memory-box:hover {
    transform: translateY(-7px) scale(1.03);
    background: rgba(255,255,255,0.3);
}

.memory-icon {
    font-size: 50px;
    margin-bottom: 8px;
}

.memory-title {
    font-size: 17px;
    font-weight: bold;
}

.memory-reveal {
    display: none;
    margin-top: 25px;
    padding: 22px;
    border-radius: 20px;
    background: rgba(255,255,255,0.22);
}

.memory-reveal.show {
    display: block;
    animation: popIn 0.5s ease;
}

/* Mystery boxes */

.mystery-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 30px;
}

.mystery-box {
    min-height: 170px;
    border-radius: 25px;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.45);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.35s;
    padding: 15px;
}

.mystery-box:hover {
    transform: translateY(-8px) scale(1.04);
    background: rgba(255,255,255,0.3);
}

.mystery-icon {
    font-size: 60px;
    margin-bottom: 10px;
}

.mystery-title {
    font-size: 16px;
    font-weight: bold;
}

.mystery-box.opened {
    opacity: 0.45;
    transform: scale(0.95);
    pointer-events: none;
}

.mystery-reveal {
    display: none;
    margin-top: 25px;
    padding: 25px;
    border-radius: 22px;
    background: rgba(255,255,255,0.22);
}

.mystery-reveal.show {
    display: block;
    animation: popIn 0.5s ease;
}

.mystery-reveal h3 {
    font-size: 25px;
    margin-top: 0;
}

.unlock-message {
    margin-top: 20px;
    animation: popIn 0.6s ease;
}

/* PHOTO GALLERY */

.gallery {
    position: relative;
    margin-top: 25px;
}

.photo-frame {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 10px;
    background: rgba(255,255,255,0.25);
    border-radius: 25px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}

.photo-frame img {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    border-radius: 18px;
    display: block;
    background: rgba(0,0,0,0.08);
}

.photo-number {
    margin-top: 15px;
    font-size: 15px;
    opacity: 0.9;
}

.photo-message {
    margin-top: 15px;
    padding: 18px;
    border-radius: 20px;
    background: rgba(255,255,255,0.18);
    animation: fadeIn 0.5s ease;
}

.gallery-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
}

.final-message {
    margin-top: 25px;
    padding: 25px;
    border-radius: 25px;
    background: rgba(255,255,255,0.2);
    animation: popIn 0.7s ease;
}

.final-message h2 {
    margin-top: 0;
}

/* Animations */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes popIn {

    from {
        opacity: 0;
        transform: scale(0.8);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 600px) {

    .card {
        padding: 28px 17px;
    }

    h1 {
        font-size: 27px;
    }

    h2 {
        font-size: 22px;
    }

    p {
        font-size: 16px;
    }

    .mystery-container {
        grid-template-columns: 1fr;
    }

    .mystery-box {
        min-height: 140px;
    }
}
</style>
</head>

<body>

<div class="card" id="app"></div>

<script>

/* Floating hearts */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML =
        Math.random() > 0.5 ? "❤️" : "💗";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

setInterval(createHeart, 700);


/* Opening */

        </h2>

        <button onclick="startJourney()">
            YES ❤️
        </button>

        <button onclick="noButton()">
            NO 😌
        </button>
    `;
}


function startJourney() {
    showQuizIntro();
}


function noButton() {

            Sorryyy cutie pattootie... 🥺
        </p>

            You must continue. 😂❤️
        </p>

            Okay fine 😭❤️
        </button>
    `;
}


/* Quiz Intro */

function showQuizIntro() {

    document.getElementById("app").innerHTML = `

        <h1>Surprise 1 👀❤️</h1>

        <h2>
            How well do you know Andhuu? 🥺
        </h2>

        <p>
            Let's see if you can answer these questions correctly. 😌❤️
        </p>

        <p>
            Don't worry...
            I think you already know the answers. 👀😂
        </p>

        <button onclick="startQuiz()">
            Start Quiz ❤️
        </button>
    `;
}


/* Quiz */

const questions = [

    {
        question:
            "Who is the most special person in Andhuu's heart? 🥺❤️",

        options: [
            "His friends 😂",
            "His phone 📱",
            "Kenzaaa ❤️",
            "Food 🍕"
        ],

        answer: 2
    },

    {
        question:
            "Who can make Andhuu smile even on his worst days? 🥹❤️",

        options: [
            "Kenzaaa ❤️",
            "A good nap 😴",
            "A new phone 📱",
            "Money 💰"
        ],

        answer: 0
    },

    {
        question:
            "Who would Andhuu choose to spend his happiest moments with? 👀❤️",

        options: [
            "His friends 😂",
            "Food 🍗",
            "His phone 📱",
            "Kenzaaa ❤️"
        ],

        answer: 3
    },

    {
        question:
            "Who has a permanent place inside Andhuu's heart? 💗",

        options: [
            "Nobody 😭",
            "His favourite celebrity ⭐",
            "Kenzaaa ❤️",
            "His gaming squad 🎮"
        ],

        answer: 2
    },

    {
        question:
            "FINAL QUESTION... Who is the MOST OBVIOUS answer to everything in Andhuu's heart? 😭❤️",

        options: [
            "Food 🍕",
            "Money 💰",
            "His phone 📱",
            "Obviously Kenzaaa ❤️"
        ],

        answer: 3
    }

];

let currentQuestion = 0;
let score = 0;


function startQuiz() {

    currentQuestion = 0;
    score = 0;

    showQuestion();
}


function showQuestion() {

    const q = questions[currentQuestion];

    let optionsHTML = "";

    q.options.forEach((option, index) => {

        optionsHTML += `

            <button
                class="quiz-option"
                onclick="answer(${index})"
                id="option${index}">

                ${option}

            </button>
        `;
    });

    document.getElementById("app").innerHTML = `

        <h1>
            How well do you know Andhuu? 👀❤️
        </h1>

        <h2>
            ${q.question}
        </h2>

        ${optionsHTML}

        <div class="progress">
            Question ${currentQuestion + 1} /
            ${questions.length}
        </div>
    `;
}


function answer(selected) {

    const q = questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".quiz-option");

    buttons.forEach(button => {
        button.disabled = true;
    });

    if (selected === q.answer) {

        score++;

        buttons[selected]
            .classList.add("correct");

        setTimeout(() => {
            nextQuestion();
        }, 700);

    } else {

        buttons[selected]
            .classList.add("wrong");

        buttons[q.answer]
            .classList.add("correct");

        setTimeout(() => {
            nextQuestion();
        }, 1000);
    }
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        finishQuiz();
    }
}


function finishQuiz() {

    document.getElementById("app").innerHTML = `

        <h1>
            Quiz Complete! 🎉❤️
        </h1>

        <h2>
            ${score} / ${questions.length} correct 🥺
        </h2>

        <p>
            And honestly...
        </p>

        <p>
            The answer was always...
        </p>

        <h1>
            Kenzaaa. 🥺❤️
        </h1>

        <button onclick="nextSurprise()">
            Next Surprise 👀❤️
        </button>
    `;
}

/* Surprise 3 */

let memoriesOpened = 0;

            <div

                </div>

                <div class="memory-title">

                </div>

            </div>


            <div
                class="memory-box"

                <div class="memory-icon">
                    😂
                </div>

                <div class="memory-title">
                    Our Silly Side
                </div>

            </div>


            <div
                class="memory-box"
                onclick="openMemory(3)"

                <div class="memory-icon">

                </div>

                <div class="memory-title">

        <div
            id="memoryReveal"

        <button
            id="nextSurpriseButton"
            class="hidden"
            onclick="surpriseFour()">

        </button>

function openMemory(index) {

    const box =
        document.getElementById("memory" + index);

    if (box.classList.contains("locked")) {
        return;
    }

    box.classList.add("locked");

    memoriesOpened++;

    const memory = memories[index];

    const reveal =
        document.getElementById("memoryReveal");

    reveal.innerHTML = `

        <h3>
            ${memory.title}
        </h3>

        <p>
            ${memory.message}
        </p>

        <p>
            ${
                memoriesOpened < 4
                ? "There are still more little secrets waiting... 👀❤️"
                : "You found all four. 🥺❤️"
            }
        </p>
    `;

    reveal.classList.remove("show");

    setTimeout(() => {
        reveal.classList.add("show");
    }, 50);


    if (memoriesOpened === 4) {

        setTimeout(() => {

            document
                .getElementById("nextSurpriseButton")
                .classList.remove("hidden");

        }, 500);

}

function showPhoto() {

    const photo = photos[currentPhoto];

    document.getElementById("app").innerHTML = `

        <h1>
            Surprise 5 📸❤️
        </h1>

            </div>

            </div>

                    currentPhoto > 0
                    ? `<button onclick="previousPhoto()">⬅️ Previous</button>`

                    currentPhoto < photos.length - 1
                    ? `<button onclick="nextPhoto()">Next ❤️</button>`
                    : ""

function nextPhoto() {

    if (currentPhoto < photos.length - 1) {

        currentPhoto++;

        showPhoto();

    else {

function previousPhoto() {

    if (currentPhoto > 0) {

        currentPhoto--;

        showPhoto();
