<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andhuu's Heart ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: white;
}

.card {
    width: 90%;
    max-width: 650px;
    padding: 35px 25px;
    border-radius: 30px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    text-align: center;
    animation: fadeIn 0.8s ease;
}

h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

h2 {
    font-size: 25px;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

button {
    border: none;
    padding: 14px 25px;
    margin: 10px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    background: white;
    color: #ff4f81;
    font-weight: bold;
    transition: 0.25s;
}

button:hover {
    transform: scale(1.07);
}

.no-btn {
    background: rgba(255,255,255,0.75);
}

.progress {
    margin-top: 15px;
    font-size: 15px;
    opacity: 0.9;
}

/* Quiz */

.quiz-option {
    display: block;
    width: 90%;
    max-width: 450px;
    margin: 12px auto;
}

.quiz-option.correct {
    background: #b9ffcf;
    color: #147a35;
}

.quiz-option.wrong {
    background: #ffb3b3;
    color: #9b1c1c;
}

/* Envelope */

.envelope {
    font-size: 90px;
    cursor: pointer;
    transition: 0.3s;
    margin: 20px;
}

.envelope:hover {
    transform: scale(1.12) rotate(-3deg);
}

/* Surprise 3 */

.memory-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-top: 25px;
}

.memory-box {
    height: 150px;
    border-radius: 22px;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.45);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
    padding: 15px;
}

.memory-box:hover {
    transform: translateY(-7px) scale(1.03);
    background: rgba(255,255,255,0.3);
}

.memory-icon {
    font-size: 50px;
    margin-bottom: 8px;
}

.memory-title {
    font-size: 17px;
    font-weight: bold;
}

.memory-reveal {
    display: none;
    margin-top: 25px;
    padding: 22px;
    border-radius: 20px;
    background: rgba(255,255,255,0.22);
    animation: popIn 0.5s ease;
}

.memory-reveal.show {
    display: block;
}

.memory-reveal h3 {
    margin-top: 0;
    font-size: 23px;
}

.locked {
    opacity: 0.45;
    pointer-events: none;
}

.next-hidden {
    display: none;
}

/* Floating hearts */

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
    pointer-events: none;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes popIn {
    from {
        opacity: 0;
        transform: scale(0.8);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 500px) {

    .card {
        padding: 28px 17px;
    }

    h1 {
        font-size: 27px;
    }

    h2 {
        font-size: 22px;
    }

    p {
        font-size: 16px;
    }

    .memory-container {
        gap: 12px;
    }

    .memory-box {
        height: 135px;
    }

    .memory-icon {
        font-size: 42px;
    }
}
</style>
</head>

<body>

<div class="card" id="app"></div>

<script>

/* Floating hearts */

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = Math.random() > 0.5 ? "❤️" : "💗";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

setInterval(createHeart, 700);


/* Opening */

function startPage() {
    document.getElementById("app").innerHTML = `
        <h1>Hi Cutie Pattootie 🥺❤️</h1>

        <p>
            Welcome to <b>Andhuu's Heart ❤️</b>
        </p>

        <p>
            There's something waiting for you inside... 👀💗
        </p>

        <h2>Do you want to continue? 👀❤️</h2>

        <button onclick="startJourney()">YES ❤️</button>
        <button class="no-btn" onclick="noButton()">NO 😌</button>
    `;
}

function startJourney() {
    showQuizIntro();
}

function noButton() {
    document.getElementById("app").innerHTML = `
        <h1>Hehe nice try! 😭❤️</h1>

        <p>
            Sorryyy cutie pattootie... 🥺
        </p>

        <p>
            You must continue. 😂❤️
        </p>

        <p>
            There's no escape from Andhuu's Heart. 😌💗
        </p>

        <button onclick="showQuizIntro()">Okay fine 😭❤️</button>
    `;
}


/* Quiz Intro */

function showQuizIntro() {
    document.getElementById("app").innerHTML = `
        <h1>Surprise 1 👀❤️</h1>

        <h2>How well do you know Andhuu? 🥺</h2>

        <p>
            Let's see if you can answer these questions correctly. 😌❤️
        </p>

        <p>
            Don't worry... I think you already know the answers. 👀😂
        </p>

        <button onclick="startQuiz()">Start Quiz ❤️</button>
    `;
}


/* Quiz Questions */

const questions = [

    {
        question: "Who is the most special person in Andhuu's heart? 🥺❤️",
        options: [
            "His friends 😂",
            "His phone 📱",
            "Kenzaaa ❤️",
            "Food 🍕"
        ],
        answer: 2
    },

    {
        question: "Who can make Andhuu smile even on his worst days? 🥹❤️",
        options: [
            "Kenzaaa ❤️",
            "A good nap 😴",
            "A new phone 📱",
            "Money 💰"
        ],
        answer: 0
    },

    {
        question: "Who would Andhuu choose to spend his happiest moments with? 👀❤️",
        options: [
            "His friends 😂",
            "Food 🍗",
            "His phone 📱",
            "Kenzaaa ❤️"
        ],
        answer: 3
    },

    {
        question: "Who has a permanent place inside Andhuu's heart? 💗",
        options: [
            "Nobody 😭",
            "His favourite celebrity ⭐",
            "Kenzaaa ❤️",
            "His gaming squad 🎮"
        ],
        answer: 2
    },

    {
        question: "FINAL QUESTION... Who is the MOST OBVIOUS answer to everything in Andhuu's heart? 😭❤️",
        options: [
            "Food 🍕",
            "Money 💰",
            "His phone 📱",
            "Obviously Kenzaaa ❤️"
        ],
        answer: 3
    }

];

let currentQuestion = 0;
let score = 0;


/* Start Quiz */

function startQuiz() {
    currentQuestion = 0;
    score = 0;
    showQuestion();
}


/* Show Question */

function showQuestion() {

    const q = questions[currentQuestion];

    let optionsHTML = "";

    q.options.forEach((option, index) => {

        optionsHTML += `
            <button
                class="quiz-option"
                onclick="answer(${index})"
                id="option${index}">
                ${option}
            </button>
        `;
    });

    document.getElementById("app").innerHTML = `
        <h1>How well do you know Andhuu? 👀❤️</h1>

        <h2>${q.question}</h2>

        ${optionsHTML}

        <div class="progress">
            Question ${currentQuestion + 1} / ${questions.length}
        </div>
    `;
}


/* Answer */

function answer(selected) {

    const q = questions[currentQuestion];

    const buttons = document.querySelectorAll(".quiz-option");

    buttons.forEach(button => {
        button.disabled = true;
    });

    if (selected === q.answer) {

        score++;

        buttons[selected].classList.add("correct");

        setTimeout(() => {
            nextQuestion();
        }, 700);

    } else {

        buttons[selected].classList.add("wrong");
        buttons[q.answer].classList.add("correct");

        setTimeout(() => {
            nextQuestion();
        }, 1000);
    }
}


/* Next Question */

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        finishQuiz();
    }
}


/* Finish Quiz */

function finishQuiz() {

    document.getElementById("app").innerHTML = `
        <h1>Quiz Complete! 🎉❤️</h1>

        <h2>${score} / ${questions.length} correct 🥺</h2>

        <p>
            And honestly...
        </p>

        <p>
            The answer was always...
        </p>

        <h1>Kenzaaa. 🥺❤️</h1>

        <button onclick="nextSurprise()">
            Next Surprise 👀❤️
        </button>
    `;
}


/* Surprise 2 */

function nextSurprise() {

    document.getElementById("app").innerHTML = `
        <h1>Surprise 2 💌</h1>

        <h2>There's something waiting for you...</h2>

        <div class="envelope" onclick="openEnvelope()">
            💌
        </div>

        <p>
            Tap the envelope 👀❤️
        </p>
    `;
}


/* Open Envelope */

function openEnvelope() {

    document.getElementById("app").innerHTML = `
        <h1>Kenzaaa ❤️</h1>

        <p>
            If you're reading this...
        </p>

        <p>
            just know that somewhere in this little website,
            there is a boy who made every single part of it
            thinking about you. 🥺
        </p>

        <p>
            You are not just a name on this screen.
            You're the reason I wanted to make this whole little journey. ❤️
        </p>

        <p>
            And this isn't even the end...
            👀❤️
        </p>

        <button onclick="surpriseThree()">
            Keep going 👀💗
        </button>
    `;
}


/* SURPRISE 3 */

let memoriesOpened = 0;

const memories = [

    {
        title: "A Little Thought 💭",
        message: "Some memories may look small from the outside... but when they involve you, they become special to me. 🥺❤️"
    },

    {
        title: "Something Special 🥹",
        message: "My favourite part of so many moments isn't what happened... it's the fact that you were there. 💗"
    },

    {
        title: "Our Silly Side 😂",
        message: "Even the random, silly and completely unnecessary moments become memories I would happily experience again with you. 😂❤️"
    },

    {
        title: "One Simple Truth ❤️",
        message: "No matter how many surprises I make, there's always one person behind the reason I made them. Kenzaaa. ❤️"
    }

];


function surpriseThree() {

    memoriesOpened = 0;

    document.getElementById("app").innerHTML = `
        <h1>Surprise 3 📸❤️</h1>

        <h2>Our Little Memories 🥺</h2>

        <p>
            Okay Kenzaaa...
            let's open these little surprises one by one. 👀💗
        </p>

        <p>
            <b>Open all 4 boxes. 🎁❤️</b>
        </p>

        <div class="memory-container">

            <div class="memory-box" onclick="openMemory(0)" id="memory0">
                <div class="memory-icon">🎁</div>
                <div class="memory-title">A Little Thought</div>
            </div>

            <div class="memory-box" onclick="openMemory(1)" id="memory1">
                <div class="memory-icon">💌</div>
                <div class="memory-title">Something Special</div>
            </div>

            <div class="memory-box" onclick="openMemory(2)" id="memory2">
                <div class="memory-icon">😂</div>
                <div class="memory-title">Our Silly Side</div>
            </div>

            <div class="memory-box" onclick="openMemory(3)" id="memory3">
                <div class="memory-icon">❤️</div>
                <div class="memory-title">One Truth</div>
            </div>

        </div>

        <div id="memoryReveal" class="memory-reveal">
        </div>

        <button id="nextSurpriseButton"
                class="next-hidden"
                onclick="surpriseFour()">
            Next Surprise 👀❤️
        </button>
    `;
}


/* Open Memory */

function openMemory(index) {

    const box = document.getElementById("memory" + index);

    if (box.classList.contains("locked")) {
        return;
    }

    box.classList.add("locked");

    memoriesOpened++;

    const memory = memories[index];

    const reveal = document.getElementById("memoryReveal");

    reveal.innerHTML = `
        <h3>${memory.title}</h3>

        <p>
            ${memory.message}
        </p>

        <p>
            ${memoriesOpened < 4
                ? "There are still more little secrets waiting... 👀❤️"
                : "You found all four. 🥺❤️"}
        </p>
    `;

    reveal.classList.remove("show");

    setTimeout(() => {
        reveal.classList.add("show");
    }, 50);

    if (memoriesOpened === 4) {

        setTimeout(() => {

            document.getElementById("nextSurpriseButton")
                .classList.remove("next-hidden");

        }, 500);
    }
}


/* Surprise 4 */

function surpriseFour() {

    document.getElementById("app").innerHTML = `
        <h1>Surprise 4 👀❤️</h1>

        <h2>Something bigger is coming... 🥺</h2>

        <p>
            You opened every little memory.
        </p>

        <p>
            But Andhuu's Heart still has more secrets inside it. ❤️
        </p>

        <p>
            And the next one might be a little more personal... 👀📸
        </p>

        <button onclick="alert('Surprise 4 is coming next... 👀❤️')">
            Continue ❤️
        </button>
    `;
}


/* Start */

startPage();

</script>

</body>
</html>
